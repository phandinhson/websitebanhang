<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - ShopVN</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- ── Header (minimal) ────────────────────────────────────── -->
<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" fill="white"/></svg></div>
      <div><span>ShopVN</span><span class="brand-sub">Mua sắm tiện lợi</span></div>
    </a>
    <div style="flex:1"></div>
    <div style="font-size:.9rem;color:#999">
      Đã có tài khoản? <a href="login.html" style="color:#e74c3c;font-weight:600">Đăng nhập</a>
    </div>
  </div>
</header>

<!-- ── Register Page ───────────────────────────────────────── -->
<div class="auth-page">
  <div class="auth-card" style="max-width:520px">

    <div class="auth-logo">✨</div>
    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-subtitle">Đăng ký để nhận nhiều ưu đãi hấp dẫn từ ShopVN!</p>

    <!-- Alert -->
    <div id="register-alert" style="display:none"></div>

    <form id="register-form" onsubmit="handleRegister(event)" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Họ và tên <span style="color:#e74c3c">*</span></label>
          <input type="text" id="name" class="form-control"
            placeholder="Nguyễn Văn A" required autocomplete="name">
          <div class="form-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Số điện thoại</label>
          <input type="tel" id="phone" class="form-control"
            placeholder="0912 345 678" autocomplete="tel">
          <div class="form-error" id="phone-error"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email <span style="color:#e74c3c">*</span></label>
        <input type="email" id="email" class="form-control"
          placeholder="email@example.com" required autocomplete="email">
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu <span style="color:#e74c3c">*</span></label>
          <div style="position:relative">
            <input type="password" id="password" class="form-control"
              placeholder="Ít nhất 8 ký tự" required autocomplete="new-password"
              style="padding-right:44px" oninput="checkPasswordStrength(this.value)">
            <button type="button" onclick="togglePw('password',this)"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem">
              👁️
            </button>
          </div>
          <!-- Password strength meter -->
          <div style="margin-top:6px;display:flex;gap:4px" id="strength-bars">
            <div style="flex:1;height:4px;border-radius:4px;background:#e0e0e0" id="bar1"></div>
            <div style="flex:1;height:4px;border-radius:4px;background:#e0e0e0" id="bar2"></div>
            <div style="flex:1;height:4px;border-radius:4px;background:#e0e0e0" id="bar3"></div>
            <div style="flex:1;height:4px;border-radius:4px;background:#e0e0e0" id="bar4"></div>
          </div>
          <div class="form-hint" id="strength-text">Nhập mật khẩu để xem độ bảo mật</div>
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password_confirmation">Xác nhận mật khẩu <span style="color:#e74c3c">*</span></label>
          <div style="position:relative">
            <input type="password" id="password_confirmation" class="form-control"
              placeholder="Nhập lại mật khẩu" required autocomplete="new-password"
              style="padding-right:44px">
            <button type="button" onclick="togglePw('password_confirmation',this)"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem">
              👁️
            </button>
          </div>
          <div class="form-error" id="confirm-error"></div>
        </div>
      </div>

      <!-- Terms checkbox -->
      <div class="form-group">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:.88rem;line-height:1.5">
          <input type="checkbox" id="agree-terms" style="accent-color:#e74c3c;margin-top:2px;flex-shrink:0">
          <span>
            Tôi đồng ý với
            <a href="#" style="color:#e74c3c">Điều khoản sử dụng</a>
            và
            <a href="#" style="color:#e74c3c">Chính sách bảo mật</a>
            của ShopVN.
          </span>
        </label>
        <div class="form-error" id="terms-error"></div>
      </div>

      <!-- Marketing checkbox -->
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem">
          <input type="checkbox" id="agree-marketing" style="accent-color:#e74c3c" checked>
          Nhận thông tin khuyến mãi và sản phẩm mới qua email
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
        ✨ Đăng ký ngay
      </button>

    </form>

    <div class="auth-divider">hoặc đăng ký với</div>

    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button class="btn btn-outline btn-block" onclick="socialLogin('google')" style="flex:1">
        🌐 Google
      </button>
      <button class="btn btn-outline btn-block" onclick="socialLogin('facebook')" style="flex:1">
        📘 Facebook
      </button>
    </div>

    <div class="auth-footer">
      Đã có tài khoản?
      <a href="login.html">Đăng nhập</a>
    </div>
  </div>
</div>

<!-- Footer -->
<div style="text-align:center;padding:20px;font-size:.82rem;color:#bdc3c7">
  © 2025 ShopVN · <a href="#" style="color:#bdc3c7">Điều khoản</a> · <a href="#" style="color:#bdc3c7">Bảo mật</a>
</div>

<div class="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script>
  document.addEventListener('appReady', () => {
    Auth.redirectIfAuth();
  });

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.textContent = isText ? '👁️' : '🙈';
  }

  function checkPasswordStrength(pw) {
    const bars   = [1,2,3,4].map(i => document.getElementById('bar'+i));
    const text   = document.getElementById('strength-text');
    const colors = ['#e74c3c','#e67e22','#f1c40f','#27ae60'];
    const labels = ['Rất yếu','Yếu','Trung bình','Mạnh'];

    let score = 0;
    if (pw.length >= 8)             score++;
    if (/[A-Z]/.test(pw))           score++;
    if (/[0-9]/.test(pw))           score++;
    if (/[^A-Za-z0-9]/.test(pw))   score++;

    bars.forEach((bar, i) => {
      bar.style.background = i < score ? colors[Math.max(0,score-1)] : '#e0e0e0';
    });
    text.textContent = pw.length ? `Độ bảo mật: ${labels[Math.max(0,score-1)]}` : 'Nhập mật khẩu để xem độ bảo mật';
    text.style.color = pw.length ? colors[Math.max(0,score-1)] : '';
  }

  async function handleRegister(e) {
    e.preventDefault();
    clearErrors();

    const name    = document.getElementById('name').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const email   = document.getElementById('email').value.trim();
    const pw      = document.getElementById('password').value;
    const pwConf  = document.getElementById('password_confirmation').value;
    const terms   = document.getElementById('agree-terms').checked;
    const alertEl = document.getElementById('register-alert');
    const btn     = document.getElementById('register-btn');

    let valid = true;
    if (!name)   { showErr('name-error',    'Vui lòng nhập họ và tên.'); valid=false; }
    if (!email)  { showErr('email-error',   'Vui lòng nhập email.'); valid=false; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('email-error','Email không hợp lệ.'); valid=false; }
    if (phone && !/^[0-9]{10,11}$/.test(phone.replace(/\s/g,''))) { showErr('phone-error','Số điện thoại không hợp lệ.'); valid=false; }
    if (!pw)     { showErr('password-error','Vui lòng nhập mật khẩu.'); valid=false; }
    else if (pw.length < 8) { showErr('password-error','Mật khẩu phải có ít nhất 8 ký tự.'); valid=false; }
    if (pw !== pwConf) { showErr('confirm-error','Mật khẩu xác nhận không khớp.'); valid=false; }
    if (!terms)  { showErr('terms-error',   'Bạn phải đồng ý với điều khoản.'); valid=false; }
    if (!valid)  return;

    btn.disabled    = true;
    btn.textContent = 'Đang xử lý...';
    alertEl.style.display = 'none';

    try {
      await API.register({ name, email, phone, password: pw, password_confirmation: pwConf });
      showToast('Đăng ký thành công! Chào mừng bạn đến với ShopVN.', 'success');
      setTimeout(() => window.location.href = '../index.html', 1200);
    } catch (err) {
      const msg = err.data?.errors
        ? Object.values(err.data.errors).flat().join('<br>')
        : (err.message || 'Đăng ký thất bại. Vui lòng thử lại.');
      alertEl.innerHTML    = `<div class="alert alert-danger">${msg}</div>`;
      alertEl.style.display = 'block';
      btn.disabled    = false;
      btn.textContent = '✨ Đăng ký ngay';
    }
  }

  function showErr(id, msg) {
    const el = document.getElementById(id);
    if (el) el.textContent = msg;
  }
  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
  }
  function socialLogin(p) {
    showToast(`Đăng ký với ${p} chưa được hỗ trợ.`, 'warning');
  }
</script>
</body>
</html>
